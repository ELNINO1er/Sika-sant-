<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard-patient.css">
</head>
<body class="patient-dashboard-page">
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content patient-main-shell">
      <div id="toastContainer" class="toast-container"></div>
      <div id="patientPageHero"></div>

      <section class="patient-page-grid patient-page-grid-2">
        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Dossiers medicaux</span>
                <h3 class="patient-module-title">Documents medicaux</h3>
              </div>
            </div>
            <div id="documentsList" class="patient-document-list"></div>
          </article>
        </div>

        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Utilisation et acces</span>
                <h3 class="patient-module-title">Ce que vous pouvez faire</h3>
              </div>
            </div>
            <div class="patient-card-note">
              <strong>Telecharger et partager</strong>
              Le patient peut telecharger une ordonnance, un resultat ou un compte rendu, mais ne modifie pas les documents officiels.
            </div>
            <div class="patient-link-list mt-3">
              <button type="button" class="patient-link-item btn btn-link text-start text-decoration-none" data-patient-action="download">
                <div>
                  <strong>Exporter mon resume medical</strong>
                  <span>Version PDF simplifiee du dossier</span>
                </div>
                <i class="bi bi-download"></i>
              </button>
              <button type="button" class="patient-link-item btn btn-link text-start text-decoration-none" data-patient-action="upload">
                <div>
                  <strong>Envoyer un document personnel</strong>
                  <span>Ancien resultat, image ou document administratif</span>
                </div>
                <i class="bi bi-upload"></i>
              </button>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      initializePatientPage,
      renderDocumentList,
      bindPatientActionButtons,
      completePatientPageLoading
    } from '../assets/js/patient-portal.js';
    import { getDocuments } from '../services/patient-api.js';

    const state = await initializePatientPage({
      pageTitle: 'Documents',
      showNavbar: false,
      heroBadge: 'Documents',
      heroTitle: 'Documents medicaux, rapports et ordonnances',
      heroDescription: 'Accedez aux comptes rendus, ordonnances et resultats rendus disponibles dans votre dossier patient.',
      heroStats: (data) => [
        { label: 'Documents', value: String(data.documents.length), description: 'Pieces deja visibles' },
        { label: 'Ordonnances', value: String(data.documents.filter((item) => item.kind === 'Ordonnance').length), description: 'Documents de prescription' },
        { label: 'Comptes rendus', value: String(data.documents.filter((item) => item.kind === 'Compte rendu').length), description: 'Consultations et suivis' },
        { label: 'Resultats', value: String(data.documents.filter((item) => item.kind === 'Resultat').length), description: 'Analyses ou bilans visibles' }
      ]
    });

    // Try loading real documents from API, fallback to derived
    let docs = state.documents;
    try {
      const res = await getDocuments();
      if (res.data && res.data.length) {
        docs = res.data.map(d => ({
          id: d.id,
          title: d.title,
          description: d.uploadedByName || 'Centre de sante',
          date: d.created_at,
          kind: (d.kind || 'AUTRE').replace('_', ' '),
          size: d.file_size ? `${Math.round(d.file_size / 1024)} Ko` : 'N/A',
          downloadable: !!d.file_path
        }));
      }
    } catch { /* fallback to derived */ }

    renderDocumentList(document.getElementById('documentsList'), docs);
    bindPatientActionButtons();
    completePatientPageLoading();
  </script>
</body>
</html>
