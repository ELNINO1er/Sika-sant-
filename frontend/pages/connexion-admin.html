<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="auth-brand mb-4">
        <i class="bi bi-shield-lock fs-3"></i>
        <span>Sika-Sante</span>
      </div>
      <h1 class="display-6 fw-bold mb-3">Connexion administrateur</h1>
      <p class="helper-text mb-4">Pilotage SaaS, supervision des comptes et des journaux d'audit.</p>

      <div class="card card-surface p-4 login-card">
        <div id="message" class="alert d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email admin</label>
            <input type="email" class="form-control" id="email" placeholder="admin@sika-sante.ci" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" placeholder="Minimum 12 caracteres" minlength="12" required>
          </div>
          <button id="loginButton" type="submit" class="btn btn-primary w-100">Demander le code MFA</button>
        </form>

        <form id="verifyMfaForm" class="mt-4 d-none" novalidate>
          <div class="mb-3">
            <label for="mfaCode" class="form-label">Code MFA</label>
            <input type="text" class="form-control" id="mfaCode" placeholder="000000" maxlength="6" required>
          </div>
          <div class="d-grid gap-2">
            <button id="verifyButton" type="submit" class="btn btn-success">Valider et acceder</button>
            <button id="resendButton" type="button" class="btn btn-outline-secondary">Renvoyer le code</button>
          </div>
        </form>

        <div class="mt-4 text-center">
          <a href="connexion.html" class="link-primary">Retour a la selection de profil</a>
        </div>
      </div>
    </section>

    <section class="auth-visual">
      <div class="glass-card">
        <h2 class="h4 mb-3">Operations admin</h2>
        <ul class="list-group list-group-flush">
          <li class="list-group-item bg-transparent px-0">Vue utilisateurs paginee</li>
          <li class="list-group-item bg-transparent px-0">Acces aux logs d'audit</li>
          <li class="list-group-item bg-transparent px-0">Rotation de tokens et session revoquable</li>
        </ul>
      </div>
    </section>
  </main>

  <script type="module">
    import { bindAsyncForm } from '../components/form.js';
    import { loginAdmin, resendMfa, verifyMfa } from '../services/auth.js';
    import { setAccessToken, setRefreshToken, setUserData } from '../utils/storage.js';
    import { setAlertMessage, showToast } from '../utils/helpers.js';

    const loginForm = document.getElementById('loginForm');
    const verifyMfaForm = document.getElementById('verifyMfaForm');
    const loginButton = document.getElementById('loginButton');
    const verifyButton = document.getElementById('verifyButton');
    const resendButton = document.getElementById('resendButton');
    const message = document.getElementById('message');

    let mfaRequestId = null;

    bindAsyncForm({
      form: loginForm,
      submitButton: loginButton,
      idleLabel: 'Demander le code MFA',
      pendingLabel: 'Verification...',
      onSubmit: () => loginAdmin(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value.trim()
      ),
      onSuccess: response => {
        mfaRequestId = response.data.mfaRequestId;
        setAlertMessage(message, `Code envoye vers ${response.data.mfaContact}.`, 'success');
        loginForm.classList.add('d-none');
        verifyMfaForm.classList.remove('d-none');
      },
      onError: error => setAlertMessage(message, error.message, 'danger')
    });

    bindAsyncForm({
      form: verifyMfaForm,
      submitButton: verifyButton,
      idleLabel: 'Valider et acceder',
      pendingLabel: 'Connexion...',
      onSubmit: () => verifyMfa(mfaRequestId, document.getElementById('mfaCode').value.trim()),
      onSuccess: response => {
        setAccessToken(response.data.accessToken);
        setRefreshToken(response.data.refreshToken);
        setUserData(response.data.userData);
        window.location.href = 'dashboard-admin.html';
      },
      onError: error => setAlertMessage(message, error.message, 'danger')
    });

    resendButton.addEventListener('click', async () => {
      if (!mfaRequestId) return;
      try {
        const response = await resendMfa(mfaRequestId);
        mfaRequestId = response.data.mfaRequestId;
        setAlertMessage(message, `Nouveau code envoye vers ${response.data.mfaContact}.`, 'success');
      } catch (error) {
        showToast(error.message, 'danger');
      }
    });
  </script>
</body>
</html>
