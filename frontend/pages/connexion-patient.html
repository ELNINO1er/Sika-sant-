<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Patient | Sika-Santé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel">
      <a href="connexion.html" class="text-decoration-none mb-4"><i class="bi bi-arrow-left me-2"></i>Retour</a>
      <div class="card card-surface p-4 login-card">
        <h1 class="h4 mb-2">Connexion patient</h1>
        <p class="helper-text mb-4">Renseignez votre numéro CMU puis validez le code OTP reçu.</p>
        <div id="message" class="alert d-none" role="alert"></div>
        <form id="requestOtpForm" class="mb-3">
          <label for="cmuNumber" class="form-label">Numéro CMU</label>
          <input type="text" class="form-control mb-3" id="cmuNumber" placeholder="1234567890" maxlength="10" required pattern="[0-9]{10}">
          <button id="requestButton" type="submit" class="btn btn-primary w-100">Recevoir un code OTP</button>
        </form>
        <form id="verifyOtpForm" class="d-none">
          <label for="otpCode" class="form-label">Code OTP</label>
          <input type="text" class="form-control mb-3" id="otpCode" placeholder="000000" maxlength="6" required>
          <button id="verifyButton" type="submit" class="btn btn-success w-100">Vérifier et accéder</button>
        </form>
      </div>
    </section>
    <section class="auth-visual">
      <div class="glass-card">
        <h2 class="h5 mb-3">Parcours sécurisé</h2>
        <p class="mb-0">Le backend génère un OTP à durée de vie courte, stocké sous forme hashée, puis délivre un JWT d’accès et un refresh token rotatif.</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { requestOtp, verifyOtp } from '../services/auth.js';
    import { setAccessToken, setRefreshToken, setUserData } from '../utils/storage.js';
    import { setAlertMessage } from '../utils/helpers.js';

    const requestForm = document.getElementById('requestOtpForm');
    const verifyForm = document.getElementById('verifyOtpForm');
    const message = document.getElementById('message');
    const requestButton = document.getElementById('requestButton');
    const verifyButton = document.getElementById('verifyButton');
    let activeRequestId = null;

    requestForm.addEventListener('submit', async event => {
      event.preventDefault();
      requestButton.disabled = true;
      requestButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Envoi…';
      setAlertMessage(message, '');

      try {
        const response = await requestOtp(document.getElementById('cmuNumber').value.trim());
        activeRequestId = response.data.otpRequestId;
        setAlertMessage(message, `Code envoyé au contact masqué ${response.data.phoneNumber}`, 'success');
        requestForm.classList.add('d-none');
        verifyForm.classList.remove('d-none');
      } catch (error) {
        setAlertMessage(message, error.message, 'danger');
      } finally {
        requestButton.disabled = false;
        requestButton.textContent = 'Recevoir un code OTP';
      }
    });

    verifyForm.addEventListener('submit', async event => {
      event.preventDefault();
      verifyButton.disabled = true;
      verifyButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Vérification…';
      setAlertMessage(message, '');

      try {
        const response = await verifyOtp(activeRequestId, document.getElementById('otpCode').value.trim());
        setAccessToken(response.data.accessToken);
        setRefreshToken(response.data.refreshToken);
        setUserData(response.data.userData);
        window.location.href = 'dashboard-patient.html';
      } catch (error) {
        setAlertMessage(message, error.message, 'danger');
      } finally {
        verifyButton.disabled = false;
        verifyButton.textContent = 'Vérifier et accéder';
      }
    });
  </script>
</body>
</html>
