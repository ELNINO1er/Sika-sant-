<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Patient | Sika-Santé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card card-surface p-4">
          <div class="mb-4 text-center">
            <h1 class="h4">Connexion Patient</h1>
            <p class="text-muted">Entrez votre numéro CMU pour recevoir un code OTP.</p>
          </div>
          <div id="message" class="alert d-none" role="alert"></div>
          <form id="requestOtpForm">
            <div class="mb-3">
              <label for="cmuNumber" class="form-label">Numéro CMU</label>
              <input type="text" class="form-control" id="cmuNumber" placeholder="1234567890" maxlength="10" required pattern="[0-9]{10}">
            </div>
            <button type="submit" class="btn btn-primary w-100">Recevoir un code OTP</button>
          </form>

          <form id="verifyOtpForm" class="mt-4 d-none">
            <div class="mb-3">
              <label for="otpCode" class="form-label">Code OTP</label>
              <input type="text" class="form-control" id="otpCode" placeholder="000000" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Vérifier et connecter</button>
          </form>

          <div class="mt-4 text-center">
            <a href="connexion.html" class="link-primary">Retour à la sélection de profil</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requestOtp, verifyOtp } from '../services/auth.js';
    import { setAccessToken, setRefreshToken, setUserData, setLogoutTimer } from '../utils/storage.js';
    import { showToast } from '../utils/helpers.js';

    const requestForm = document.getElementById('requestOtpForm');
    const verifyForm = document.getElementById('verifyOtpForm');
    const message = document.getElementById('message');
    let activeRequestId = null;

    function showMessage(text, type = 'success') {
      message.textContent = text;
      message.className = `alert alert-${type}`;
      message.classList.remove('d-none');
    }

    function hideMessage() {
      message.classList.add('d-none');
    }

    requestForm.addEventListener('submit', async event => {
      event.preventDefault();
      hideMessage();

      const cmuNumber = document.getElementById('cmuNumber').value.trim();
      try {
        const response = await requestOtp(cmuNumber);
        activeRequestId = response.data.otpRequestId;
        showMessage(`Code envoyé à ${response.data.phoneNumber}`);
        requestForm.classList.add('d-none');
        verifyForm.classList.remove('d-none');
      } catch (error) {
        showMessage(error.message, 'danger');
      }
    });

    verifyForm.addEventListener('submit', async event => {
      event.preventDefault();
      hideMessage();

      const otpCode = document.getElementById('otpCode').value.trim();
      try {
        const response = await verifyOtp(activeRequestId, otpCode);
        setAccessToken(response.data.accessToken);
        setRefreshToken(response.data.refreshToken);
        setUserData(response.data.userData);
        setLogoutTimer(15 * 60);
        window.location.href = 'dashboard-patient.html';
      } catch (error) {
        showMessage(error.message, 'danger');
      }
    });
  </script>
</body>
</html>
