<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Institution | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content">
      <div id="appNavbar"></div>
      <div id="toastContainer" class="toast-container"></div>

      <section class="metric-strip mb-4">
        <div class="metric-card">
          <span class="metric-label">Etat API</span>
          <strong id="apiStatus">-</strong>
          <span class="metric-helper">Disponibilite backend</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Environnement</span>
          <strong id="environmentName">-</strong>
          <span class="metric-helper">Contexte d'execution</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Audit visible</span>
          <strong id="auditVisibleCount">0</strong>
          <span class="metric-helper">Evenements traces</span>
        </div>
      </section>

      <section class="row g-4">
        <div class="col-lg-4">
          <div class="card card-surface p-4 h-100">
            <h2 class="h5 mb-3">Disponibilite service</h2>
            <dl class="row mb-0">
              <dt class="col-sm-5">Uptime</dt>
              <dd class="col-sm-7" id="uptimeValue">-</dd>
              <dt class="col-sm-5">Dernier check</dt>
              <dd class="col-sm-7" id="healthTimestamp">-</dd>
            </dl>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card card-surface p-4 h-100">
            <h2 class="h5 mb-3">Audit logs</h2>
            <div id="institutionAuditTable"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { renderNavbar, bindNavbarActions } from '../components/navbar.js';
    import { renderSidebar } from '../components/sidebar.js';
    import { renderDataTable } from '../components/data-table.js';
    import { apiGet } from '../services/api.js';
    import { listAuditLogs } from '../services/admin.js';
    import { authGuard, roleGuard } from '../utils/guards.js';
    import { ROLES } from '../utils/access.js';
    import { formatDateTime, showToast, toggleDarkMode } from '../utils/helpers.js';
    import { getDarkMode } from '../utils/storage.js';

    await authGuard();
    roleGuard(ROLES.INSTITUTION);

    document.getElementById('appSidebar').innerHTML = renderSidebar();
    document.getElementById('appNavbar').innerHTML = renderNavbar();
    bindNavbarActions();
    toggleDarkMode(getDarkMode());

    const auditTable = document.getElementById('institutionAuditTable');
    renderDataTable(auditTable, { columns: [], rows: [], loading: true });

    function formatUptime(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      return `${hours}h ${minutes}m`;
    }

    try {
      const [healthResponse, auditResponse] = await Promise.all([
        apiGet('/health'),
        listAuditLogs({ page: 1, pageSize: 20 })
      ]);

      const health = healthResponse.data;
      const logs = auditResponse.data.items || [];

      document.getElementById('apiStatus').textContent = health.status || 'ok';
      document.getElementById('environmentName').textContent = health.environment || 'development';
      document.getElementById('uptimeValue').textContent = formatUptime(Math.round(health.uptime || 0));
      document.getElementById('healthTimestamp').textContent = formatDateTime(health.timestamp);
      document.getElementById('auditVisibleCount').textContent = String(auditResponse.data.meta?.total || logs.length);

      renderDataTable(auditTable, {
        columns: [
          { label: 'Date', render: row => formatDateTime(row.created_at) },
          { label: 'Action', render: row => row.action },
          { label: 'Utilisateur', render: row => row.userName || row.userEmail || 'Systeme' },
          { label: 'IP', render: row => row.ip || '-' }
        ],
        rows: logs,
        emptyTitle: 'Aucun evenement',
        emptyDescription: 'Aucun log d audit n est disponible.'
      });
    } catch (error) {
      showToast(error.message, 'danger');
      renderDataTable(auditTable, {
        columns: [],
        rows: [],
        emptyTitle: 'Chargement impossible',
        emptyDescription: 'Les donnees institutionnelles n ont pas pu etre chargees.'
      });
    }
  </script>
</body>
</html>
