<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical History | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content patient-main-shell">
      <div id="appNavbar"></div>
      <div id="toastContainer" class="toast-container"></div>
      <div id="patientPageHero"></div>

      <section class="patient-page-grid patient-page-grid-2">
        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Consultations table</span>
                <h3 class="patient-module-title">Historique des consultations</h3>
              </div>
            </div>
            <div id="historyTable"></div>
          </article>
        </div>

        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Open details</span>
                <h3 class="patient-module-title">Detail de la consultation</h3>
              </div>
            </div>
            <div id="historyDetails"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      initializePatientPage,
      renderHistoryTableWithDetails
    } from '../assets/js/patient-portal.js';

    const state = await initializePatientPage({
      pageTitle: 'Medical History',
      heroBadge: 'Medical history',
      heroTitle: 'Historique medical et consultations passees',
      heroDescription: 'Relisez vos consultations, le professionnel concerne, la date et le resume disponible dans votre dossier.',
      heroStats: (data) => [
        { label: 'Consultations', value: String(data.history.length), description: 'Enregistrements consultables' },
        { label: 'Derniere visite', value: data.latestHistory ? new Date(data.latestHistory.created_at).toLocaleDateString('fr-FR') : 'Aucune', description: 'Derniere date synchronisee' },
        { label: 'Documents', value: String(data.documents.length), description: 'Associes a vos consultations' },
        { label: 'Soignants', value: String(new Set(data.history.map((item) => item.professionalName || 'Centre')).size), description: 'Intervenants visibles' }
      ]
    });

    renderHistoryTableWithDetails({
      tableContainer: document.getElementById('historyTable'),
      detailContainer: document.getElementById('historyDetails'),
      history: state.history
    });
  </script>
</body>
</html>
