<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Patient | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="layout-shell">
    <div id="appSidebar"></div>

    <main class="main-content patient-main-shell">
      <div id="appNavbar"></div>
      <div id="toastContainer" class="toast-container"></div>

      <section class="card-surface patient-overview-board">
        <header id="patientOverviewHeader" class="patient-overview-header"></header>

        <div class="patient-overview-grid">
          <article class="patient-overview-card medications-card">
            <div class="patient-panel-header">
              <div>
                <span class="small-label">Traitements actuels</span>
                <h3 class="patient-panel-title">Traitements en cours</h3>
              </div>
            </div>
            <div id="overviewMedications" class="patient-medication-stack"></div>
            <div class="patient-overview-footer">
              <a href="patient-medications.html">Voir tous les traitements</a>
              <button type="button" data-patient-action="refill">Demander un renouvellement</button>
            </div>
          </article>

          <article class="patient-overview-card appointment-card">
            <div class="patient-panel-header">
              <div>
                <span class="small-label">Prochain rendez-vous</span>
                <h3 class="patient-panel-title">Prochain rendez-vous</h3>
              </div>
            </div>
            <div id="overviewAppointment"></div>
          </article>

          <article class="patient-overview-card messages-card">
            <div class="patient-panel-header">
              <div>
                <span class="small-label">Nouveaux messages</span>
                <h3 class="patient-panel-title">Messages recents <span id="messageCounter" class="patient-item-tag">0</span></h3>
              </div>
            </div>
            <div id="overviewMessages" class="patient-thread-list"></div>
          </article>

          <article class="patient-overview-card history-card">
            <div class="patient-panel-header">
              <div>
                <span class="small-label">Dossier medical</span>
                <h3 class="patient-panel-title">Historique medical recent</h3>
              </div>
              <a class="patient-panel-link" href="patient-history.html">Voir tout le dossier</a>
            </div>
            <div id="overviewHistory" class="patient-history-table"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      initializePatientPage,
      bindPatientActionButtons,
      escapeHtml
    } from '../assets/js/patient-portal.js';
    import { formatDate, formatDateTime } from '../utils/helpers.js';
    import { logout } from '../services/auth.js';

    const patientPhoto = '../assets/img/home.jpg';
    const attachmentThumb = '../assets/img/seka01.jpg';
    const appointmentThumb = '../assets/img/seka2.jpg';

    const state = await initializePatientPage({
      pageTitle: 'Dashboard Patient',
      showNavbar: false
    });

    const firstName = (state.profile.name || 'Patient').split(' ')[0];
    const messageCount = state.messages.length;
    const refillCount = state.treatments.filter((item) => item.status === 'Actif').length > 0 ? 1 : 0;
    const latestHistory = state.latestHistory;

    function buildMedicationRows(items) {
      const rows = items.slice(0, 3);
      if (!rows.length) {
        return `
          <div class="patient-empty-card">
            <strong>Aucun traitement actif</strong>
            <p>Les prescriptions visibles apparaitront ici apres publication par le centre.</p>
          </div>
        `;
      }

      return rows.map((item) => `
        <div class="patient-medication-row">
          <div>
            <strong>${escapeHtml(item.label)}</strong>
            <div class="patient-medication-meta">${escapeHtml(item.dosage)}</div>
          </div>
          <i class="bi bi-chevron-right patient-row-arrow"></i>
        </div>
      `).join('');
    }

    function buildAppointmentBlock() {
      const derivedDate = latestHistory
        ? new Date(new Date(latestHistory.created_at).getTime() + (21 * 24 * 60 * 60 * 1000))
        : null;
      const dateLabel = derivedDate
        ? derivedDate.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long' })
        : 'A confirmer';

      const timeLabel = derivedDate ? '10:30 - 11:00 - 30 min' : 'Date et heure a confirmer';
      const doctorName = latestHistory?.professionalName || 'Equipe clinique';

      return `
        <div class="patient-appointment-main">
          <div class="patient-appointment-date">${escapeHtml(dateLabel)}</div>
          <div class="patient-appointment-line">
            <i class="bi bi-clock"></i>
            <span>${escapeHtml(timeLabel)}</span>
          </div>
          <div class="patient-appointment-line">
            <i class="bi bi-geo-alt"></i>
            <span>Centre Sika-Sante Abidjan</span>
          </div>
          <div class="patient-inline-person">
            <img src="${patientPhoto}" alt="Professionnel de sante">
            <div>
              <strong>${escapeHtml(doctorName)}</strong>
              <small class="text-muted">Professionnel de sante</small>
            </div>
          </div>
          <a class="patient-panel-link" href="patient-appointments.html">Gerer le rendez-vous</a>
          <img class="patient-thumb-banner" src="${appointmentThumb}" alt="Consultation et suivi medical">
        </div>
      `;
    }

    function buildMessageThreads(items) {
      return items.slice(0, 3).map((item, index) => `
        <div class="patient-thread-card">
          <img class="patient-photo-avatar" src="${patientPhoto}" alt="Auteur du message">
          <div class="patient-thread-main">
            <strong>${escapeHtml(item.sender)}</strong>
            <small>${escapeHtml(formatDateTime(item.date))}</small>
            <p>${escapeHtml(item.preview)}</p>
            ${index === 1 ? `
              <div class="patient-attachment-card">
                <img src="${attachmentThumb}" alt="Attachment preview">
                <div>
                  <strong>Fasting_Results.pdf</strong>
                  <small>345kb</small>
                </div>
              </div>
            ` : ''}
          </div>
          <div class="patient-thread-toolbar">
            <i class="bi bi-three-dots-vertical"></i>
          </div>
        </div>
      `).join('');
    }

    function buildHistoryTable(rows) {
      if (!rows.length) {
        return `
          <div class="patient-empty-card">
            <strong>Aucun historique medical</strong>
            <p>Les consultations synchronisees apparaitront ici.</p>
          </div>
        `;
      }

      const body = rows.slice(0, 5).map((row) => `
        <tr>
          <td>
            <strong>${escapeHtml(row.professionalName || 'Equipe clinique')}</strong>
            <small>${escapeHtml(row.title || 'Consultation')}</small>
          </td>
          <td>${escapeHtml(formatDate(row.created_at))}</td>
          <td>${escapeHtml(row.summary || 'Resume non disponible')}</td>
          <td class="patient-history-status">Disponible</td>
        </tr>
      `).join('');

      return `
        <table>
          <thead>
            <tr>
              <th>Professionnel</th>
              <th>Date</th>
              <th>Resume</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    document.getElementById('patientOverviewHeader').innerHTML = `
      <div class="patient-overview-copy">
        <h2>Bonjour, ${escapeHtml(firstName)}</h2>
        <p>Vous avez ${messageCount} nouveau(x) message(s) et ${refillCount} demande(s) de renouvellement a traiter.</p>
      </div>
      <div class="patient-overview-profile">
        <button type="button" id="patientProfileTrigger" class="patient-profile-trigger" aria-expanded="false" aria-haspopup="true">
          <img class="patient-photo-avatar" src="${patientPhoto}" alt="Photo patient">
          <div>
            <strong>${escapeHtml(state.profile.name || 'Patient')}</strong>
            <small>No. ${escapeHtml(state.profile.cmuNumber || 'Non attribue')}</small>
          </div>
          <i class="bi bi-chevron-down"></i>
        </button>
        <div id="patientProfileMenu" class="patient-profile-menu" role="menu">
          <a href="patient-profile.html" role="menuitem">
            <i class="bi bi-person"></i>
            <span>Mon profil</span>
          </a>
          <a href="patient-appointments.html" role="menuitem">
            <i class="bi bi-calendar-event"></i>
            <span>Mes rendez-vous</span>
          </a>
          <button type="button" id="patientLogoutMenu" role="menuitem">
            <i class="bi bi-box-arrow-right"></i>
            <span>Deconnexion</span>
          </button>
        </div>
      </div>
    `;

    document.getElementById('messageCounter').textContent = String(messageCount);
    document.getElementById('overviewMedications').innerHTML = buildMedicationRows(state.treatments);
    document.getElementById('overviewAppointment').innerHTML = buildAppointmentBlock();
    document.getElementById('overviewMessages').innerHTML = buildMessageThreads(state.messages);
    document.getElementById('overviewHistory').innerHTML = buildHistoryTable(state.history);

    bindPatientActionButtons();

    const profileTrigger = document.getElementById('patientProfileTrigger');
    const profileMenu = document.getElementById('patientProfileMenu');
    const logoutButton = document.getElementById('patientLogoutMenu');

    function closeProfileMenu() {
      profileMenu.classList.remove('is-open');
      profileTrigger.setAttribute('aria-expanded', 'false');
    }

    profileTrigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = profileMenu.classList.toggle('is-open');
      profileTrigger.setAttribute('aria-expanded', String(open));
    });

    document.addEventListener('click', (event) => {
      if (!profileMenu.contains(event.target) && !profileTrigger.contains(event.target)) {
        closeProfileMenu();
      }
    });

    logoutButton.addEventListener('click', logout);
  </script>
</body>
</html>
