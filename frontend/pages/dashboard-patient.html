<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Patient | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content">
      <div id="appNavbar"></div>
      <div id="toastContainer" class="toast-container"></div>

      <section class="metric-strip mb-4">
        <div class="metric-card">
          <span class="metric-label">Patient</span>
          <strong id="profileName">Chargement...</strong>
          <span id="profileRole" class="metric-helper">Profil</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">CMU</span>
          <strong id="cmuNumber">-</strong>
          <span class="metric-helper">Identifiant sante</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Historique recent</span>
          <strong id="historyCount">0</strong>
          <span class="metric-helper">Consultations chargees</span>
        </div>
      </section>

      <section class="row g-4">
        <div class="col-xl-4">
          <div class="card card-surface p-4 h-100">
            <h2 class="h5 mb-3">Coordonnees</h2>
            <dl class="row mb-0">
              <dt class="col-sm-5">Telephone</dt>
              <dd class="col-sm-7" id="profilePhone">-</dd>
              <dt class="col-sm-5">Email</dt>
              <dd class="col-sm-7" id="profileEmail">-</dd>
            </dl>
          </div>
        </div>
        <div class="col-xl-8">
          <div class="card card-surface p-4 h-100">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h2 class="h5 mb-1">Historique medical</h2>
                <p class="text-muted mb-0">Flux alimente par l'API patient.</p>
              </div>
            </div>
            <div id="historyTable"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { renderNavbar, bindNavbarActions } from '../components/navbar.js';
    import { renderSidebar } from '../components/sidebar.js';
    import { renderDataTable } from '../components/data-table.js';
    import { loadUserProfile } from '../services/auth.js';
    import { authGuard, roleGuard } from '../utils/guards.js';
    import { ROLES } from '../utils/access.js';
    import { formatDateTime, getRoleLabel, showToast, toggleDarkMode } from '../utils/helpers.js';
    import { getDarkMode } from '../utils/storage.js';

    await authGuard();
    roleGuard(ROLES.PATIENT);

    document.getElementById('appSidebar').innerHTML = renderSidebar();
    document.getElementById('appNavbar').innerHTML = renderNavbar();
    bindNavbarActions();
    toggleDarkMode(getDarkMode());

    const historyTable = document.getElementById('historyTable');
    renderDataTable(historyTable, {
      columns: [],
      rows: [],
      loading: true
    });

    try {
      const response = await loadUserProfile();
      const history = response.recentHistory || [];

      document.getElementById('profileName').textContent = response.name || 'Patient';
      document.getElementById('profileRole').textContent = getRoleLabel(response.role || ROLES.PATIENT);
      document.getElementById('cmuNumber').textContent = response.cmuNumber || 'Non renseigne';
      document.getElementById('profilePhone').textContent = response.phone || 'Non renseigne';
      document.getElementById('profileEmail').textContent = response.email || 'Non renseigne';
      document.getElementById('historyCount').textContent = String(history.length);

      renderDataTable(historyTable, {
        columns: [
          { label: 'Date', render: row => formatDateTime(row.created_at) },
          { label: 'Titre', render: row => row.title || 'Consultation' },
          { label: 'Professionnel', render: row => row.professionalName || 'Non renseigne' },
          { label: 'Resume', render: row => row.summary || 'Aucun resume disponible' }
        ],
        rows: history,
        emptyTitle: 'Aucun historique',
        emptyDescription: 'Les consultations apparaitront ici apres synchronisation.'
      });
    } catch (error) {
      showToast(error.message, 'danger');
      renderDataTable(historyTable, {
        columns: [],
        rows: [],
        emptyTitle: 'Chargement impossible',
        emptyDescription: 'Le profil patient n a pas pu etre recupere.'
      });
    }
  </script>
</body>
</html>
