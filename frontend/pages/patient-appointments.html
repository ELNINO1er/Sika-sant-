<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rendez-vous | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="patient-dashboard-page">
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content patient-main-shell">
      <div id="toastContainer" class="toast-container"></div>
      <div id="patientPageHero"></div>

      <section class="patient-page-grid patient-page-grid-2">
        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Rendez-vous a venir</span>
                <h3 class="patient-module-title">Rendez-vous a venir</h3>
              </div>
            </div>
            <div id="upcomingAppointments" class="patient-stacked-list"></div>
          </article>
        </div>

        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Rendez-vous passes</span>
                <h3 class="patient-module-title">Rendez-vous passes</h3>
              </div>
            </div>
            <div id="pastAppointments" class="patient-stacked-list"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      initializePatientPage,
      renderAppointmentBlocks,
      bindPatientActionButtons,
      completePatientPageLoading
    } from '../assets/js/patient-portal.js';

    const state = await initializePatientPage({
      pageTitle: 'Rendez-vous',
      showNavbar: false,
      heroBadge: 'Rendez-vous',
      heroTitle: 'Rendez-vous a venir et rendez-vous passes',
      heroDescription: 'Suivez vos rendez-vous, confirmez votre presence et demandez un nouveau creneau lorsque cela est necessaire.',
      heroStats: (data) => [
        { label: 'A venir', value: String(data.appointments.upcoming.length), description: 'Rendez-vous a planifier ou confirmer' },
        { label: 'Passes', value: String(data.appointments.past.length), description: 'Historique des rendez-vous relies' },
        { label: 'Derniere visite', value: data.latestHistory ? new Date(data.latestHistory.created_at).toLocaleDateString('fr-FR') : 'Aucune', description: 'Derniere consultation visible' },
        { label: 'Actions', value: 'Demande', description: 'Gestion simple cote patient' }
      ]
    });

    renderAppointmentBlocks(document.getElementById('upcomingAppointments'), state.appointments.upcoming, {
      emptyTitle: 'Aucun rendez-vous a venir',
      emptyDescription: 'Vous pouvez demander un rendez-vous ou une teleconsultation.',
      allowManage: true
    });

    renderAppointmentBlocks(document.getElementById('pastAppointments'), state.appointments.past, {
      emptyTitle: 'Aucun rendez-vous passe',
      emptyDescription: 'Les rendez-vous deja effectues apparaitront ici.'
    });

    bindPatientActionButtons();
    completePatientPageLoading();
  </script>
</body>
</html>
