<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="patient-dashboard-page">
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content patient-main-shell">
      <div id="toastContainer" class="toast-container"></div>
      <div id="patientPageHero"></div>

      <section class="patient-page-grid patient-page-grid-2">
        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Boite de reception</span>
                <h3 class="patient-module-title">Messages recus</h3>
              </div>
            </div>
            <div id="messagesInbox" class="patient-message-list"></div>
          </article>
        </div>

        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Lecture</span>
                <h3 class="patient-module-title">Message selectionne</h3>
              </div>
            </div>
            <div id="messageDetail" class="patient-stacked-list"></div>

            <div id="replySection" class="patient-reply-section" style="display:none; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border);">
              <strong style="font-size:0.9rem;">R&eacute;pondre</strong>
              <form id="replyForm" style="display:grid; gap:0.6rem; margin-top:0.5rem;">
                <input type="text" class="form-control" id="replySubject" placeholder="Objet de la r&eacute;ponse" required>
                <textarea class="form-control" id="replyBody" rows="3" placeholder="Votre message..." minlength="5" required></textarea>
                <button type="submit" class="btn btn-primary btn-sm">Envoyer</button>
              </form>
            </div>
          </article>

          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Alertes</span>
                <h3 class="patient-module-title">Rappels du centre</h3>
              </div>
            </div>
            <div id="messageNotifications" class="patient-message-list"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      initializePatientPage,
      escapeHtml,
      completePatientPageLoading
    } from '../assets/js/patient-portal.js';
    import { formatDateTime, showToast } from '../utils/helpers.js';
    import { getMessages, markMessageRead, sendMessage } from '../services/patient-api.js';

    const state = await initializePatientPage({
      pageTitle: 'Messagerie',
      showNavbar: false,
      heroBadge: 'Messagerie',
      heroTitle: 'Messages patient et echanges utiles',
      heroDescription: 'Consultez les messages du centre, relisez les pieces jointes et suivez les rappels importants de votre parcours de soins.',
      heroStats: (data) => [
        { label: 'Messages', value: String(data.messages.length), description: 'Messages visibles dans votre boite' },
        { label: 'Non lus', value: String(data.messages.length), description: 'A confirmer cote API' },
        { label: 'Pieces jointes', value: String(data.documents.length), description: 'Documents rattaches aux messages' },
        { label: 'Rappels', value: String(data.notifications.length), description: 'Informations recues du centre' }
      ]
    });

    const inbox = document.getElementById('messagesInbox');
    const detail = document.getElementById('messageDetail');
    const notifications = document.getElementById('messageNotifications');

    // Try loading real messages from API, fallback to derived
    let rows = state.messages.length ? state.messages : [];
    try {
      const res = await getMessages();
      if (res.data?.messages?.length) {
        rows = res.data.messages.map(m => ({
          id: m.id,
          sender: m.senderName || 'Centre de sante',
          subject: m.subject,
          preview: m.body,
          date: m.created_at,
          attachment: m.attachment_document_id ? 'Document joint' : '',
          isRead: !!m.is_read
        }));
      }
    } catch { /* fallback to derived */ }
    let selected = rows[0] || null;

    function renderSelected() {
      if (!selected) {
        detail.innerHTML = `
          <div class="patient-empty-card">
            <strong>Aucun message</strong>
            <p>Les messages du centre s afficheront ici lorsqu ils seront disponibles.</p>
          </div>
        `;
        return;
      }

      detail.innerHTML = `
        <div class="patient-list-item">
          <div class="patient-list-item-head">
            <div>
              <strong>${escapeHtml(selected.sender)}</strong>
              <div class="text-muted">${escapeHtml(formatDateTime(selected.date))}</div>
            </div>
            <span class="status-badge success">Lu</span>
          </div>
          <div class="patient-card-note mt-3">
            <strong>${escapeHtml(selected.subject)}</strong>
            <p class="mb-0 mt-2">${escapeHtml(selected.preview)}</p>
          </div>
          ${selected.attachment ? `
            <div class="patient-document-item mt-3">
              <div class="patient-document-main">
                <span class="patient-document-kind">Piece jointe</span>
                <strong>${escapeHtml(selected.attachment)}</strong>
                <small>Document telechargeable depuis votre dossier</small>
              </div>
              <button type="button" class="btn btn-outline-secondary btn-sm">Telecharger</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderInbox() {
      if (!rows.length) {
        inbox.innerHTML = `
          <div class="patient-empty-card">
            <strong>Aucun message recu</strong>
            <p>Votre boite de reception medicale s affichera ici.</p>
          </div>
        `;
        return;
      }

      inbox.innerHTML = rows.map((item, index) => `
        <button type="button" class="patient-message-item text-start ${selected?.id === item.id ? 'active' : ''}" data-message-index="${index}">
          <div class="patient-message-icon"><i class="bi bi-chat-dots"></i></div>
          <div>
            <strong>${escapeHtml(item.sender)}</strong>
            <div class="patient-message-subject">${escapeHtml(item.subject)}</div>
            <p>${escapeHtml(item.preview)}</p>
            <div class="patient-meta-row">
              <span>${escapeHtml(formatDateTime(item.date))}</span>
              ${item.attachment ? `<span class="patient-attachment-chip"><i class="bi bi-paperclip"></i>${escapeHtml(item.attachment)}</span>` : ''}
            </div>
          </div>
        </button>
      `).join('');

      inbox.querySelectorAll('[data-message-index]').forEach((button) => {
        button.addEventListener('click', async () => {
          selected = rows[Number(button.dataset.messageIndex)];
          if (selected?.id && !selected.isRead) {
            try {
              await markMessageRead(selected.id);
              selected.isRead = true;
            } catch { /* ignore */ }
          }
          renderInbox();
          renderSelected();
        });
      });
    }

    notifications.innerHTML = state.notifications.map((item) => `
      <div class="patient-message-item">
        <div class="patient-message-icon"><i class="bi ${escapeHtml(item.icon)}"></i></div>
        <div>
          <strong>Centre de sante</strong>
          <div class="patient-message-subject">${escapeHtml(item.title)}</div>
          <p>${escapeHtml(item.text)}</p>
          <div class="patient-meta-row">
            <span>${escapeHtml(formatDateTime(new Date().toISOString()))}</span>
          </div>
        </div>
      </div>
    `).join('');

    renderInbox();
    renderSelected();

    // Reply section visibility
    const replySection = document.getElementById('replySection');
    const replyForm = document.getElementById('replyForm');

    function updateReplyVisibility() {
      if (selected?.senderUserId || selected?.id) {
        replySection.style.display = 'block';
        document.getElementById('replySubject').value = `Re: ${selected.subject || ''}`;
      } else {
        replySection.style.display = 'none';
      }
    }
    updateReplyVisibility();

    // Override renderSelected to also show reply
    const origRenderSelected = renderSelected;
    function renderSelectedWithReply() {
      origRenderSelected();
      updateReplyVisibility();
    }

    // Re-bind inbox clicks to use updated render
    inbox.querySelectorAll('[data-message-index]').forEach((button) => {
      const clone = button.cloneNode(true);
      button.replaceWith(clone);
      clone.addEventListener('click', async () => {
        selected = rows[Number(clone.dataset.messageIndex)];
        if (selected?.id && !selected.isRead) {
          try { await markMessageRead(selected.id); selected.isRead = true; } catch {}
        }
        renderInbox();
        origRenderSelected();
        updateReplyVisibility();
      });
    });

    replyForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const subject = document.getElementById('replySubject').value.trim();
      const body = document.getElementById('replyBody').value.trim();
      if (!subject || body.length < 5) {
        showToast('Veuillez saisir un objet et un message (5 caract\u00e8res minimum).', 'warning');
        return;
      }
      // Use the sender of the selected message as recipient, or fallback to professional user 2
      const recipientId = selected?.senderUserId || 2;
      const btn = replyForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Envoi...';
      try {
        await sendMessage(recipientId, subject, body);
        showToast('Votre message a \u00e9t\u00e9 envoy\u00e9 avec succ\u00e8s.', 'success');
        document.getElementById('replyBody').value = '';
      } catch (error) {
        showToast(error.message || 'Impossible d\'envoyer le message.', 'danger');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Envoyer';
      }
    });

    completePatientPageLoading();
  </script>
</body>
</html>
