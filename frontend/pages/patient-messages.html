<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="patient-dashboard-page">
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content patient-main-shell">
      <div id="toastContainer" class="toast-container"></div>
      <div id="patientPageHero"></div>

      <section class="patient-page-grid patient-page-grid-2">
        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Boite de reception</span>
                <h3 class="patient-module-title">Messages recus</h3>
              </div>
            </div>
            <div id="messagesList" class="patient-message-list"></div>
          </article>
        </div>

        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Notifications</span>
                <h3 class="patient-module-title">Alertes et rappels</h3>
              </div>
            </div>
            <div id="messageNotifications" class="patient-message-list"></div>
            <div class="patient-inline-actions">
              <button type="button" class="btn btn-outline-primary btn-sm" data-patient-action="message">Contacter le centre</button>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      initializePatientPage,
      renderMessageList,
      bindPatientActionButtons
    } from '../assets/js/patient-portal.js';

    const state = await initializePatientPage({
      pageTitle: 'Messagerie',
      showNavbar: false,
      heroBadge: 'Messagerie',
      heroTitle: 'Messages patient et echanges utiles',
      heroDescription: 'Retrouvez les messages utiles, les informations du centre et les pieces jointes disponibles dans votre espace.',
      heroStats: (data) => [
        { label: 'Messages', value: String(data.messages.length), description: 'Echanges affiches dans la boite' },
        { label: 'Alertes', value: String(data.notifications.length), description: 'Rappels et informations utiles' },
        { label: 'Pieces jointes', value: String(data.documents.length), description: 'Documents visibles a ce stade' },
        { label: 'Messagerie', value: 'Bientot', description: 'Question administrative securisee' }
      ]
    });

    renderMessageList(document.getElementById('messagesList'), state.messages);
    renderMessageList(
      document.getElementById('messageNotifications'),
      state.notifications.map((item, index) => ({
        id: `notification-${index}`,
        sender: 'Centre de sante',
        subject: item.title,
        preview: item.text,
        date: new Date().toISOString(),
        attachment: ''
      }))
    );

    bindPatientActionButtons();
  </script>
</body>
</html>
