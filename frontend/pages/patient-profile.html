<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="patient-dashboard-page">
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content patient-main-shell">
      <div id="toastContainer" class="toast-container"></div>
      <div id="patientPageHero"></div>

      <section class="patient-page-grid patient-page-grid-2">
        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Informations personnelles</span>
                <h3 class="patient-module-title">Informations personnelles</h3>
              </div>
            </div>
            <div id="profilePersonal" class="patient-profile-grid"></div>
          </article>

          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Coordonnees</span>
                <h3 class="patient-module-title">Coordonnees</h3>
              </div>
            </div>
            <div id="profileContact" class="patient-profile-grid"></div>
          </article>
        </div>

        <div class="patient-page-column">
          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Identifiants sante</span>
                <h3 class="patient-module-title">CMU et identifiants</h3>
              </div>
            </div>
            <div id="profileIdentifiers" class="patient-profile-grid"></div>
          </article>

          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Contact d urgence</span>
                <h3 class="patient-module-title">Contact d urgence</h3>
              </div>
            </div>
            <div id="profileEmergency" class="patient-profile-grid"></div>
          </article>

          <article class="card-surface section-card patient-module">
            <div class="section-header">
              <div>
                <span class="small-label">Resume medical</span>
                <h3 class="patient-module-title">Resume medical</h3>
              </div>
            </div>
            <div id="profileSummary" class="patient-summary-grid"></div>
            <div class="patient-inline-actions">
              <button type="button" class="btn btn-outline-primary btn-sm" data-patient-action="profile">Demander une mise a jour</button>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      initializePatientPage,
      renderProfileGrid,
      renderSummaryGrid,
      bindPatientActionButtons
    } from '../assets/js/patient-portal.js';

    const state = await initializePatientPage({
      pageTitle: 'Mon Profil',
      showNavbar: false,
      heroBadge: 'Profil',
      heroTitle: 'Profile patient et informations de contact',
      heroDescription: 'Consultez votre identite, vos coordonnees et les informations utiles reliees a votre dossier.',
      heroStats: (data) => [
        { label: 'CMU', value: data.profile.cmuNumber || '-', description: 'Identifiant patient visible' },
        { label: 'Contact', value: data.profile.phone || 'A completer', description: 'Telephone principal' },
        { label: 'Email', value: data.profile.email || 'A completer', description: 'Adresse de contact' },
        { label: 'Urgence', value: 'A completer', description: 'Personne a prevenir en cas de besoin' }
      ]
    });

    renderProfileGrid(document.getElementById('profilePersonal'), state.profileSections.personal);
    renderProfileGrid(document.getElementById('profileContact'), state.profileSections.contact);
    renderProfileGrid(document.getElementById('profileIdentifiers'), state.profileSections.identifiers);
    renderProfileGrid(document.getElementById('profileEmergency'), state.profileSections.emergency);
    renderSummaryGrid(document.getElementById('profileSummary'), state.summaryItems.slice(0, 6));
    bindPatientActionButtons();
  </script>
</body>
</html>
