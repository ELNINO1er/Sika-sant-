<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Sika-Sant&eacute;</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/sika-sante-mark.svg">
  <link rel="shortcut icon" href="../assets/img/sika-sante-mark.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="auth-selector-shell">
    <section class="auth-selector-panel">
      <a href="/" class="auth-back-link auth-selector-back-button">
        <i class="bi bi-arrow-left"></i>
        Retour &agrave; la vitrine
      </a>

      <div class="auth-selector-brand">
        <span class="landing-premium-brand-badge">
          <img src="../assets/img/sika-sante-mark.svg" alt="Logo SIKA SANTE">
        </span>
        <div>
          <strong>Sika-Sant&eacute;</strong>
          <small>Carnet m&eacute;dical connect&eacute;</small>
        </div>
      </div>

      <span class="landing-premium-badge auth-selector-heading-badge" id="selectorBadge">
        <i class="bi bi-person-heart"></i>
        Connexion patient
      </span>

      <div class="auth-selector-copy">
        <h1 id="selectorTitle">Acc&eacute;dez &agrave; votre espace patient simplement</h1>
        <p id="selectorDescription">
          Entrez votre num&eacute;ro CMU, recevez votre code OTP puis retrouvez votre carnet dans un parcours clair.
        </p>
      </div>

      <div class="card-surface auth-selector-form-card">
        <div class="form-stage" id="selectorStage">
          <strong>Identification patient</strong>
        </div>

        <div id="selectorMessage" class="alert d-none" role="alert"></div>
        <div id="selectorFormMount"></div>
      </div>
    </section>

    <section class="auth-selector-showcase">
      <div class="auth-selector-showcase-glow"></div>

      <div class="auth-selector-showcase-card">
        <div class="auth-selector-showcase-head">
          <span class="landing-premium-badge">
            <i class="bi bi-grid-1x2"></i>
            Quatre espaces
          </span>
          <h2>Choisissez votre profil</h2>
        </div>

        <div class="auth-selector-cards" id="selectorCards">
          <button type="button" class="auth-role-card is-active" data-profile="patient">
            <span class="auth-role-card-icon"><i class="bi bi-person-heart"></i></span>
            <strong>Patient</strong>
            <small>CMU + OTP pour consulter le carnet personnel.</small>
          </button>

          <button type="button" class="auth-role-card" data-profile="professional">
            <span class="auth-role-card-icon"><i class="bi bi-stethoscope"></i></span>
            <strong>Professionnel</strong>
            <small>Email + MFA pour le suivi clinique et les consultations.</small>
          </button>

          <button type="button" class="auth-role-card" data-profile="admin">
            <span class="auth-role-card-icon"><i class="bi bi-shield-lock"></i></span>
            <strong>Admin</strong>
            <small>Supervision des comptes, audits et acc&egrave;s sensibles.</small>
          </button>

          <button type="button" class="auth-role-card" data-profile="institution">
            <span class="auth-role-card-icon"><i class="bi bi-bank"></i></span>
            <strong>Institution</strong>
            <small>Vue globale des tendances, alertes et activit&eacute;s consolid&eacute;es.</small>
          </button>
        </div>

      </div>
    </section>
  </main>

  <script type="module" src="../assets/js/connexion-selector.js"></script>
</body>
</html>
