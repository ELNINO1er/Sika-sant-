<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Pharmacie | Sika-Santé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card card-surface p-4">
          <div class="mb-4 text-center">
            <h1 class="h4">Connexion Pharmacie</h1>
            <p class="text-muted">Entrez votre email et mot de passe de pharmacie pour recevoir un code MFA.</p>
          </div>
          <div id="message" class="alert d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="pharmacie.moderne@sika-sante.ci" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="password" placeholder="Mot de passe" required minlength="12">
            </div>
            <button type="submit" class="btn btn-primary w-100">Demander le code MFA</button>
          </form>

          <form id="verifyMfaForm" class="mt-4 d-none">
            <div class="mb-3">
              <label for="mfaCode" class="form-label">Code MFA</label>
              <input type="text" class="form-control" id="mfaCode" placeholder="000000" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Valider et accéder</button>
          </form>

          <div class="mt-4 text-center">
            <a href="connexion.html" class="link-primary">Retour à la sélection de profil</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { loginProfessional, verifyMfa } from '../services/auth.js';
    import { setAccessToken, setRefreshToken, setUserData, setLogoutTimer } from '../utils/storage.js';

    const loginForm = document.getElementById('loginForm');
    const verifyMfaForm = document.getElementById('verifyMfaForm');
    const message = document.getElementById('message');
    let mfaRequestId = null;

    function showMessage(text, type = 'success') {
      message.textContent = text;
      message.className = `alert alert-${type}`;
      message.classList.remove('d-none');
    }

    function hideMessage() {
      message.classList.add('d-none');
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      hideMessage();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await loginProfessional(email, password);
        mfaRequestId = response.data.mfaRequestId;
        showMessage(`Code MFA envoyé à ${response.data.mfaContact}`);
        loginForm.classList.add('d-none');
        verifyMfaForm.classList.remove('d-none');
      } catch (error) {
        showMessage(error.message, 'danger');
      }
    });

    verifyMfaForm.addEventListener('submit', async event => {
      event.preventDefault();
      hideMessage();
      const mfaCode = document.getElementById('mfaCode').value.trim();

      try {
        const response = await verifyMfa(mfaRequestId, mfaCode);
        setAccessToken(response.data.accessToken);
        setRefreshToken(response.data.refreshToken);
        setUserData(response.data.userData);
        setLogoutTimer(15 * 60);
        window.location.href = 'dashboard-professional.html';
      } catch (error) {
        showMessage(error.message, 'danger');
      }
    });
  </script>
</body>
</html>
