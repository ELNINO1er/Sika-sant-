<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin | Sika-Sante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="layout-shell">
    <div id="appSidebar"></div>
    <main class="main-content">
      <div id="appNavbar"></div>
      <div id="toastContainer" class="toast-container"></div>

      <section class="metric-strip mb-4">
        <div class="metric-card">
          <span class="metric-label">Utilisateurs</span>
          <strong id="usersCount">0</strong>
          <span class="metric-helper">Comptes visibles</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Logs d'audit</span>
          <strong id="logsCount">0</strong>
          <span class="metric-helper">Evenements traces</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Profils</span>
          <strong id="rolesCount">0</strong>
          <span class="metric-helper">Roles actifs</span>
        </div>
      </section>

      <section class="row g-4">
        <div class="col-12">
          <div class="card card-surface p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h2 class="h5 mb-1">Utilisateurs</h2>
                <p class="text-muted mb-0">Vue consolidee des comptes de la plateforme.</p>
              </div>
            </div>
            <div id="usersTable"></div>
          </div>
        </div>
        <div class="col-12">
          <div class="card card-surface p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h2 class="h5 mb-1">Audit logs recents</h2>
                <p class="text-muted mb-0">Evenements securite et operations critiques.</p>
              </div>
            </div>
            <div id="auditTable"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { renderNavbar, bindNavbarActions } from '../components/navbar.js';
    import { renderSidebar } from '../components/sidebar.js';
    import { renderDataTable } from '../components/data-table.js';
    import { listAuditLogs, listUsers } from '../services/admin.js';
    import { authGuard, roleGuard } from '../utils/guards.js';
    import { ROLES } from '../utils/access.js';
    import { formatDateTime, showToast, toggleDarkMode } from '../utils/helpers.js';
    import { getDarkMode } from '../utils/storage.js';

    await authGuard();
    roleGuard(ROLES.ADMIN);

    document.getElementById('appSidebar').innerHTML = renderSidebar();
    document.getElementById('appNavbar').innerHTML = renderNavbar();
    bindNavbarActions();
    toggleDarkMode(getDarkMode());

    const usersTable = document.getElementById('usersTable');
    const auditTable = document.getElementById('auditTable');

    renderDataTable(usersTable, { columns: [], rows: [], loading: true });
    renderDataTable(auditTable, { columns: [], rows: [], loading: true });

    try {
      const [usersResponse, auditResponse] = await Promise.all([
        listUsers({ page: 1, pageSize: 20 }),
        listAuditLogs({ page: 1, pageSize: 20 })
      ]);

      const users = usersResponse.data.items || [];
      const logs = auditResponse.data.items || [];

      document.getElementById('usersCount').textContent = String(usersResponse.data.meta?.total || users.length);
      document.getElementById('logsCount').textContent = String(auditResponse.data.meta?.total || logs.length);
      document.getElementById('rolesCount').textContent = String(new Set(users.map(user => user.role)).size);

      renderDataTable(usersTable, {
        columns: [
          { label: 'Nom', render: row => `<strong>${row.name}</strong>` },
          { label: 'Role', render: row => row.role },
          { label: 'Contact', render: row => row.email || row.phone || 'Non renseigne' },
          { label: 'Creation', render: row => formatDateTime(row.created_at) }
        ],
        rows: users,
        emptyTitle: 'Aucun utilisateur',
        emptyDescription: 'Aucun compte n est remonte par l API.'
      });

      renderDataTable(auditTable, {
        columns: [
          { label: 'Date', render: row => formatDateTime(row.created_at) },
          { label: 'Action', render: row => row.action },
          { label: 'Utilisateur', render: row => row.userName || row.userEmail || 'Systeme' },
          { label: 'IP', render: row => row.ip || '-' }
        ],
        rows: logs,
        emptyTitle: 'Aucun log',
        emptyDescription: 'Le journal d audit est vide.'
      });
    } catch (error) {
      showToast(error.message, 'danger');
      renderDataTable(usersTable, {
        columns: [],
        rows: [],
        emptyTitle: 'Erreur utilisateur',
        emptyDescription: 'Impossible de charger les utilisateurs.'
      });
      renderDataTable(auditTable, {
        columns: [],
        rows: [],
        emptyTitle: 'Erreur audit',
        emptyDescription: 'Impossible de charger les logs.'
      });
    }
  </script>
</body>
</html>
